
name: Iris MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py neural_network.py

      - name: Verify model artifacts
        run: |
          python -c "import os; assert os.path.isfile('iris_model_weights.npz'), 'Model weights missing'; assert os.path.isfile('iris_preprocessing.npz'), 'Preprocessing file missing'; print('Model artifacts found')"
